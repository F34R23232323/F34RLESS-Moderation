              - name: "☕ Support the project"
                value: "https://url.f34rless.xyz/donate"
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  credits:
    description: "Show project credits"
    aliases: ["contributors"]
    actions:
      - type: send_message
        embeds:
          - title: "✨ Credits"
            description: "Thanks to the developers, moderators, contributors, testers, supporters, and community members who help improve the server."
            color: "#EB459E"
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  ghost-ping:
    description: "Explain why ghost pings are not allowed"
    aliases: ["ghostping"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "👻 Please Do Not Ghost Ping"
            description: "Mentioning someone and immediately deleting the message creates a notification without useful context."
            color: "#FEE75C"
            fields:
              - name: "✅ Better approach"
                value: "Only mention someone when necessary and leave enough context for them to understand why."
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  ping-spam:
    description: "Warn against excessive mentions"
    aliases: ["excessive-pinging", "mention-spam"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "🔔 Avoid Excessive Pinging"
            description: "Do not repeatedly mention users, roles, or staff. One relevant mention is enough."
            color: "#FEE75C"
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  ping-context:
    description: "Ask members to include context when pinging"
    aliases: ["pinging-with-no-reason", "ping-reason"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "💬 Include Context With Mentions"
            description: "Do not send a bare mention. Put your question or reason in the same message so the recipient knows what you need."
            color: "#FEE75C"
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  staff-ping:
    description: "Explain when staff should be mentioned"
    aliases: ["mod-ping", "ping-staff"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "🚨 When to Ping Staff"
            description: "Mention staff only for urgent, active safety issues. Use tickets or reports for routine questions and non-urgent problems."
            color: "#ED4245"
            footer: { text: "Guidance from {username}", icon_url: "{useravatarurl}" }

  donate:
    description: "Show ways to support the project"
    aliases: ["patreon", "support-project"]
    actions:
      - type: send_message
        embeds:
          - title: "💜 Support the Project"
            description: "Supporting the project helps fund hosting, infrastructure, and continued development."
            color: "#EB459E"
            fields:
              - name: "☕ Membership and donations"
                value: "https://url.f34rless.xyz/donate"
              - name: "🙏 Thank you"
                value: "Support is optional and never required to participate in the community."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  hosting:
    description: "Show Square Hosting resources"
    aliases: ["square-hosting", "sqh"]
    actions:
      - type: send_message
        embeds:
          - title: "☁️ Square Hosting"
            description: "Resources for Discord bot hosting and platform support."
            color: "#5865F2"
            fields:
              - name: "🌐 Website"
                value: "https://url.f34rless.xyz/square-hosting"
              - name: "🛟 Support"
                value: "https://url.f34rless.xyz/square-hosting-support"
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  suggestion-guide:
    description: "Explain how to submit a useful suggestion"
    aliases: ["suggesthelp", "idea-guide"]
    actions:
      - type: send_message
        embeds:
          - title: "💡 Suggestions"
            description: "Submit ideas through the server's suggestion system so members and staff can review them."
            color: "#FEE75C"
            fields:
              - name: "✍️ A useful suggestion"
                value: "Describe the problem, your proposed change, who benefits, and any drawbacks."
              - name: "🚫 Avoid"
                value: "Do not spam, repeatedly bump, or pressure others to vote for your idea."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  scam-safety:
    description: "Share scam and phishing safety advice"
    aliases: ["scams", "phishing"]
    actions:
      - type: send_message
        embeds:
          - title: "🎣 Scam and Phishing Safety"
            description: "Do not trust unexpected giveaways, free products, urgent account warnings, or requests to scan QR codes."
            color: "#ED4245"
            fields:
              - name: "🔍 Before clicking"
                value: "Check the full domain, verify the sender independently, and never enter credentials through an unsolicited link."
              - name: "🚨 If compromised"
                value: "Change your password, enable multi-factor authentication, revoke sessions, and tell staff."
            footer: { text: "Safety reminder • Requested by {username}" }

  dm-safety:
    description: "Share direct-message safety advice"
    aliases: ["dms", "dm-guide"]
    actions:
      - type: send_message
        embeds:
          - title: "📨 Direct Message Safety"
            description: "Staff should not ask for passwords, payment credentials, recovery codes, or remote access in DMs."
            color: "#57F287"
            fields:
              - name: "🛡️ Stay safe"
                value: "Verify identities through the server, block suspicious accounts, and report scams with evidence."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  account-safety:
    description: "Share account security best practices"
    aliases: ["security", "secure-account"]
    actions:
      - type: send_message
        embeds:
          - title: "🔑 Secure Your Account"
            description: "Use a unique password, enable multi-factor authentication, save backup codes securely, and review authorised apps."
            color: "#57F287"
            fields:
              - name: "⚠️ Never share"
                value: "Passwords, login tokens, session cookies, backup codes, QR login screens, or one-time codes."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  self-promo:
    description: "Remind members about self-promotion"
    aliases: ["advertising", "no-ads"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "📣 Self-Promotion"
            description: "Do not advertise servers, services, referral links, social accounts, or private messages unless the rules explicitly allow it."
            color: "#FEE75C"
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  spoiler-warning:
    description: "Remind members to mark spoilers"
    aliases: ["spoilers"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "🙈 Mark Spoilers"
            description: "Use Discord spoiler formatting and clearly label what the spoiler is for before revealing it."
            color: "#FEE75C"
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  keep-civil:
    description: "Ask members to de-escalate a conversation"
    aliases: ["calm-down", "conduct"]
    permissions: ["ManageMessages"]
    suppress_reply: true
    delete_input: 1
    actions:
      - type: send_message
        embeds:
          - title: "🤝 Keep the Conversation Civil"
            description: "Discuss ideas without insults, harassment, threats, dogpiling, or personal attacks. Step away if the conversation is becoming heated."
            color: "#FEE75C"
            footer: { text: "Reminder from {username}", icon_url: "{useravatarurl}" }

  bug-report:
    description: "Explain how to report a bot or website bug"
    aliases: ["bug", "report-bug"]
    actions:
      - type: send_message
        embeds:
          - title: "🐛 Reporting a Bug"
            description: "Use the support system and include enough information for the issue to be reproduced."
            color: "#5865F2"
            fields:
              - name: "📋 Include"
                value: "The command or page, exact steps, expected result, actual result, time of occurrence, and screenshots or errors."
              - name: "🔐 Remove secrets"
                value: "Never include tokens, passwords, private keys, session cookies, or personal information."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  partnerships:
    description: "Explain partnership and collaboration requests"
    aliases: ["partner", "collab"]
    actions:
      - type: send_message
        embeds:
          - title: "🤝 Partnerships"
            description: "Send partnership or collaboration proposals through the official support system."
            color: "#5865F2"
            fields:
              - name: "📄 Include"
                value: "Who you represent, the proposal, expected benefits for both communities, relevant links, and a contact method."
              - name: "⏳ Review"
                value: "Unsolicited advertising is not a partnership request. Please wait for a response without repeatedly pinging staff."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  commissions:
    description: "Explain how to ask about development commissions"
    aliases: ["commission", "hire"]
    actions:
      - type: send_message
        embeds:
          - title: "🛠️ Development Enquiries"
            description: "Use the official support system for commission or development enquiries."
            color: "#5865F2"
            fields:
              - name: "📋 Helpful details"
                value: "Project scope, required features, preferred technology, target date, budget range, and examples."
              - name: "🔒 Payments"
                value: "Confirm terms through official channels and never send sensitive payment information in public chat."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }

  faq:
    description: "Show frequently asked community questions"
    aliases: ["questions"]
    actions:
      - type: send_message
        embeds:
          - title: "❓ Frequently Asked Questions"
            description: "Check the rules, channel descriptions, pinned messages, and official information posts before opening a ticket."
            color: "#5865F2"
            fields:
              - name: "🎫 Still need help?"
                value: "Open one support ticket with a clear summary and any relevant evidence."
              - name: "🤖 Bot issue?"
                value: "Use the bug-report guidance and include the command, error, and reproduction steps."
            footer: { text: "Requested by {username}", icon_url: "{useravatarurl}" }
