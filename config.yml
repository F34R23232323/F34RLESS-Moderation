      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        You've received a warning on your account.

        Reason: {reason}
        Issued by: {moderator}
        Case ID: {case_id}

        A warning is a heads-up - no mute or ban was applied. Repeated warnings can lead to stronger action, so please take a moment to read the server rules.

        If you believe this warning was a mistake, {appeal_instructions}.
    mute:
      enabled: true
      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        You've been muted and can no longer send messages.

        Duration: {duration}
        Reason: {reason}
        Issued by: {moderator}
        Case ID: {case_id}

        Once the time is up you'll be able to chat again. Please use the time to review the server rules.

        If you believe this mute was a mistake, {appeal_instructions}.
    timeout:
      enabled: true
      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        You've been timed out and can no longer send messages for a while.

        Duration: {duration}
        Reason: {reason}
        Issued by: {moderator}
        Case ID: {case_id}

        Once the time is up you'll be able to chat again. Please use the time to review the server rules.

        If you believe this was a mistake, {appeal_instructions}.
    kick:
      enabled: true
      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        You've been kicked from the server.

        Reason: {reason}
        Issued by: {moderator}
        Case ID: {case_id}

        A kick isn't a permanent ban - you're welcome to rejoin later. Please make sure to follow the rules when you return.

        If you believe this kick was a mistake, {appeal_instructions}.
    ban:
      enabled: true
      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        You've been banned from the server.

        Reason: {reason}
        Issued by: {moderator}
        Case ID: {case_id}
        Duration: {duration}

        A ban removes your access to the server. If you believe this was a mistake, {appeal_instructions}.
    unban:
      enabled: false
      format: components_v2
      content: |-
        Hi {user}, good news from the {guild} moderation team.

        Your ban has been lifted and you're welcome to rejoin the server.

        Please make sure to follow the server rules this time. If you have any questions, reach out to a staff member.
    unmute:
      enabled: false
      format: components_v2
      content: |-
        Hi {user}, good news from the {guild} moderation team.

        Your mute has been lifted and you can send messages again.

        Please remember to follow the server rules going forward.
    case_closed:
      enabled: true
      format: components_v2
      content: |-
        Hi {user}, this is a message from the {guild} moderation team.

        A punishment on your account was removed (case {case_id}) by {moderator}.

        Reason: {reason}

        If you have any questions, {appeal_instructions}.
