appeals:
  # Public appeals portal Ã¢â‚¬â€ one config per guild. The global block below is
  # applied to every guild; per-guild overrides live under guild_overrides and
  # fall back to these values for anything they omit.
  enabled: true
  # Role pinged in the appeal card when a new appeal is filed.
  ping_role_id: "1479233921051787284"
  # Channel where appeal cards are posted.
  log_channel_id: "1467101228944068668"
  # Optional audit channel for appeal lifecycle events (submitted / accepted /
  # denied / ignored). Leave unset to disable.
  logging_channel_id: "1467101317699993663"
  # Auto-open a thread per appeal so staff can discuss without leaving Discord.
  thread_auto_create: true
  # Punishment types that may be appealed via the portal.
  eligible_punishment_types:
    - ban
    - mute
    - warn
    - timeout
    - kick
  # Minimum time a user must wait between appeal submissions.
  cooldown_seconds: 300
  max_open_appeals_per_user: 3
  blocking:
    enabled: true
    default_reason: "Your appeal access is restricted by staff. Do not DM staff about this."
  # Questions rendered on the appeals portal (https://<dashboard>/appeals/1466990155020898413).
  form:
    - id: why_unfair
      label: "Why do you believe this punishment is unfair?"
      type: long_text
      required: true
      min_length: 30
      max_length: 2000
      help_text: "Give as much detail as you can Ã¢â‚¬â€ context helps staff review faster."
    - id: what_happened
      label: "In your own words, what happened?"
      type: long_text
      required: true
      min_length: 20
      max_length: 2000
      help_text: "Be honest. Staff already have the evidence on record."
    - id: rules
      label: "Have you read the server rules and do you understand why this action was taken?"
      type: short_text
      required: true
      min_length: 10
      max_length: 500
    - id: how_long_member
      label: "How long have you been a member of this server?"
      type: short_text
      required: true
      min_length: 2
      max_length: 200
      help_text: "Roughly is fine Ã¢â‚¬â€ e.g. 'about a year' or 'a few weeks'."
    - id: evidence
      label: "Do you have any evidence or additional context that supports your appeal?"
      type: long_text
      required: false
      min_length: 0
      max_length: 2000
      help_text: "Screenshots, message links, timestamps Ã¢â‚¬â€ anything staff should consider. Optional."
    - id: zero_rights_ack
      label: "I understand that severe infractions (hate speech, CSAM, doxxing, threats) carry zero appeal rights."
      type: checkbox
      required: true
    - id: third_party_ack
      label: "I am submitting this appeal myself and have not asked anyone else to appeal on my behalf."
      type: checkbox
      required: true
    - id: no_dm_ack
      label: "I understand I must not DM staff about this appeal Ã¢â‚¬â€ all communication goes through the portal."
      type: checkbox
      required: true
    - id: agreement
      label: "I will follow the server rules going forward, and I understand staff decisions are final."
      type: checkbox
      required: true
    - id: additional_info
      label: "Anything else you'd like staff to know?"
      type: long_text
      required: false
      min_length: 0
      max_length: 2000
  guild_overrides: {}
