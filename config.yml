      shadow_mode: false
      action_chain:
        - type: create_report
        - type: delete_message
        - type: send_channel_message
          format: components_v2
          content: Your message was removed in {channel}.
          title: Spam Detected
          description: |-
            Hey {user}, your message was removed.

            Your message was removed because you sent too many messages too quickly.

            If you think this was a mistake, just message any staff member and we will happily take another look.
          footer: Thanks for helping keep {guild} friendly and safe.
          accent_color: "#ED4245"
