regex_engine:
  enabled: true
  rules:
    - name: Zalgo
      patterns:
        - "[\\u{1F100}-\\u{1F1FF}]"
        - "[\\uFF01-\\uFF5E]{3,}"
        - "[\\u0370-\\u03FF]"
        - "[\\u0400-\\u04FF]"
        - "[\\u{1D400}-\\u{1D7FF}]"
        - "[\\u200B-\\u200F\\u202A-\\u202E\\uFEFF]"
        - "[\\u0300-\\u036F]{5,}"
        - "[\\u0336\\u0337\\u0338\\u0321\\u0322\\u0327\\u0328]{3,}"
        - "[\\u0300-\\u0315\\u0345]{4,}"
      flags: giu
      scope: message
      enabled: true
      immune_roles: []
      action_chain:
        - type: create_report
        - type: delete_message
        - type: send_channel_message
          format: components_v2
          content: Your message was removed in {channel}.
          title: Zalgo Text Removed
          description: |-
            Hey {user}, your message was removed.

            Your message was removed because it used Zalgo / glitch text.

