# -----------------------------------------------------------------------------
# Discord NATIVE AutoMod responses.
# When Discord's own AutoMod executes an action (e.g. blocks a message) the bot
# posts a configured response. Keyed by AutoMod rule ID + the action it fired on.
#
#   on: block_message            # block_message | send_alert_message | timeout
#                                # block_member_interaction | any (or a list)
#   format: plain | embed | components_v2
#                                # embed = CV1 classic embed builder
#                                # components_v2 = CV2 container builder
#
# Placeholders: ${originmessagecontent} (blocked content), ${matchedcontent},
# ${matchedkeyword}, ${user}, ${user_mention} / ${userping}, ${user_tag},
# ${user_id}, ${channel}, ${channel_name}, ${channel_id}, ${guild}, ${rule_name},
# ${rule_id}, ${rule_trigger}, ${action}, ${nowtimestamp}.
#
# Mentions are disabled on ALL responses here (hardcoded) - never pings.
# -----------------------------------------------------------------------------
native_automod:
  enabled: true
  responses:
    - enabled: true
      rule_id: "1528109018227150969"
      on: block_message
      format: components_v2
      title: "Mention Blocked"
      description: |-
        A message was blocked by AutoMod for mentioning a protected user in a reply.

        **Original Message:**
        > ${originmessagecontent}
      content: "Original message: ${originmessagecontent}"
      accent_color: "#FEE75C"
      delete_after_seconds: 30
